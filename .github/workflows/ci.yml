name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: miner_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: miner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://miner_test:local_test_only@127.0.0.1:5432/miner_test
      TEST_DATABASE_URL: postgresql://miner_test:local_test_only@127.0.0.1:5432/miner_test
      NEXT_PUBLIC_LOCAL_FIRST_SYNC: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browser
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser and dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install Playwright OS dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}
      - run: npm run db:migrate
      - run: npm run db:verify
      - run: npm run build
      - name: Run E2E tests
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Run production smoke tests
        if: matrix.browser == 'chromium'
        run: npm run test:e2e:prod
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

  e2e-local-first:
    name: E2E Local-First (chromium)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: miner_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: miner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://miner_test:local_test_only@127.0.0.1:5432/miner_test
      TEST_DATABASE_URL: postgresql://miner_test:local_test_only@127.0.0.1:5432/miner_test
      NEXT_PUBLIC_LOCAL_FIRST_SYNC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browser
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser and dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run db:migrate
      - run: npm run db:verify
      - run: npm run build
      - name: Run Local-First E2E tests
        run: npx playwright test tests/e2e/local-first-sync.spec.ts tests/e2e/local-first-performance.spec.ts --project=chromium
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-local-first
          path: playwright-report/
          retention-days: 7

  validate:
    name: validate
    needs: [check, e2e, e2e-local-first]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all checks passed
        run: |
          if [ "${{ needs.check.result }}" != "success" ] || [ "${{ needs.e2e.result }}" != "success" ] || [ "${{ needs.e2e-local-first.result }}" != "success" ]; then
            echo "One or more checks failed"
            exit 1
          fi
          echo "All checks passed successfully"
