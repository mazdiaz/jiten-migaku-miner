name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: miner_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: miner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://miner_test:local_test_only@127.0.0.1:5432/miner_test
      TEST_DATABASE_URL: postgresql://miner_test:local_test_only@127.0.0.1:5432/miner_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run check
      - run: npm run test:e2e
      - run: npm run test:e2e:prod
