services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: miner
      POSTGRES_PASSWORD: miner
      POSTGRES_DB: miner
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - miner_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miner"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  miner_postgres:
